# --- PATH ---
# Prepend Homebrew to the inherited PATH so plugin scripts (TPM, vim-tmux-navigator)
# can find the `tmux` binary. Do NOT hard-replace PATH: that drops /opt/homebrew/bin
# on Apple Silicon and every plugin `run-shell` fails with 127 (command not found).
set-environment -g PATH "/opt/homebrew/bin:$PATH"

# --- Terminal & Colors ---

# Set terminal color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'

#set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-environment -g COLORTERM "truecolor"

set -g set-clipboard on      # Enable system clipboard

# start window numbering from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Enable terminal cursor shape changes
set-option -g terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Default to a block cursor (normal mode)
set -g @normal_cursor "\e[2 q"  # Block cursor
set -g @insert_cursor "\e[6 q"  # Line cursor


# --- Prefix Configuration ---
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# --- Window Splits ---
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# --- Reload Config ---
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Pane Resizing ---
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z


# --- Copy to system clipboard ---
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# --- Mouse & Vi Mode ---
set -g mouse on
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Plugin Settings ---
set -g @themepack 'powerline'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# =============================================
# MINIMAL THEME CONFIGURATION
# =============================================

# Define colors
BG_COLOR="#1A1D23" # Astronvim theme
BG_COLOR="#242933" # Nordic theme
ACTIVE_COLOR="#b4befe"
INACTIVE_COLOR="#6c7086"
TEXT_COLOR="#cdd6f4"
ACCENT_COLOR="#b4befe"

# Basic status bar setup
set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left

# Status bar colors and style
set -g status-style "bg=default,fg=$TEXT_COLOR"
set -g status-left-length 100
set -g status-right-length 100

# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"

# Message style
set -g message-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"

# Window status format - using dots instead of asterisks
set -g window-status-format "#[fg=$ACTIVE_COLOR] #I:#W "
set -g window-status-current-format "#[fg=$ACTIVE_COLOR,bold] #I:#W "

# Window status separator
set -g window-status-separator ""

# Set a border or line style right above the status bar using pane borders
set -g pane-border-status bottom
set -g pane-border-format ""


# Status left (session name with minimal styling)
set -g status-left "#[fg=$ACCENT_COLOR,bold]  #S #[fg=$INACTIVE_COLOR]│ "

# Status right (current path and time)
# set -g status-right "#[fg=$TEXT_COLOR] #(echo #{pane_current_path} | sed \"s:^$HOME:~:\") #[fg=$INACTIVE_COLOR]│ #[fg=$ACCENT_COLOR]#(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'N/A')% #[fg=$INACTIVE_COLOR]│ #[fg=$ACTIVE_COLOR,bold]%I:%M %p "

# Status right (CPU %, RAM %, Battery %, Date)
set -g status-right "\
#[fg=$ACCENT_COLOR] #[fg=$TEXT_COLOR]#([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) \
#[fg=$INACTIVE_COLOR]│ \
#[fg=$ACCENT_COLOR] #[fg=$TEXT_COLOR]#(date '+%d/%m/%y %a') \
#[fg=$INACTIVE_COLOR]│ \
#[fg=$ACCENT_COLOR] #[fg=$TEXT_COLOR]#(date +%H:%M) \
#[fg=$INACTIVE_COLOR]│ \
#[fg=$ACCENT_COLOR] #[fg=$TEXT_COLOR]#(system_profiler SPPowerDataType | awk '/State of Charge/ {print $5}' || cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'N/A')%"

# [fg=$ACCENT_COLOR] #[fg=$TEXT_COLOR]#(date +%I:%M\ %p) \ for 12 hour format 


# Copy mode styling
set -g mode-style "bg=$ACTIVE_COLOR,fg=$ACCENT_COLOR"

# Clock mode
set -g clock-mode-colour "$ACTIVE_COLOR"
set -g clock-mode-style 24


# --- Initialize TMUX plugin manager (Must be the last line) ---
run '~/.tmux/plugins/tpm/tpm'
